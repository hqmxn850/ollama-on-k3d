---
# ==========================================================
# [Phase 3] アプリケーション・AI・監視基盤プロビジョニング
# 高速並行パイプライン:
#   Stage 1: 独立ミドルウェアの先行マニフェスト一括投入 (Launch)
#            Serverノード: Rancher (CORE), kube-prometheus-stack (Monitoring)
#            Workerノード: AMD GPU / NPU, Lemonade (GPU LLM), Open WebUI (AI)
#   Stage 2: 各ミドルウェアの並行収束待機 & 事後構成 (Converge)
# ==========================================================
- name: "[Phase 3] アプリケーション・AI・監視基盤プロビジョニング (先行投入・並行収束パイプライン)"
  hosts: local
  gather_facts: true
  tasks:
    # --------------------------------------------------------
    # Stage 1: 先行マニフェスト一括投入 (Launch)
    # --------------------------------------------------------
    - name: "[Stage 1-1/5] [Server] cert-manager & Rancher マニフェスト先行投入"
      ansible.builtin.include_role:
        name: rancher
        tasks_from: launch.yml
        apply:
          tags:
            - apps
            - rancher
      tags:
        - apps
        - rancher

    - name: "[Stage 1-2/5] [Server] kube-prometheus-stack マニフェスト先行投入"
      ansible.builtin.include_role:
        name: monitoring
        tasks_from: launch.yml
        apply:
          tags:
            - apps
            - monitoring
      tags:
        - apps
        - monitoring

    - name: "[Stage 1-3/5] [Worker] AMD GPU / NPU Device Plugin デプロイ"
      ansible.builtin.include_role:
        name: amd_gpu
        apply:
          tags:
            - apps
            - amd_gpu
            - gpu
      when: amd_gpu_plugin_enabled | default(true) | bool
      tags:
        - apps
        - amd_gpu
        - gpu

    - name: "[Stage 1-4/5] [Worker] Lemonade Server (GPU LLM / Ollama 互換 API) デプロイ"
      ansible.builtin.include_role:
        name: lemonade
        apply:
          tags:
            - apps
            - lemonade
            - llm
            - ai
      when: lemonade_enabled | default(true) | bool
      tags:
        - apps
        - lemonade
        - llm
        - ai

    - name: "[Stage 1-5/5] [Worker] Open WebUI (Local AI Web チャット基盤) デプロイ"
      ansible.builtin.include_role:
        name: open_webui
        apply:
          tags:
            - apps
            - open_webui
            - webui
            - ai
      when: open_webui_enabled | default(true) | bool
      tags:
        - apps
        - open_webui
        - webui
        - ai

    # --------------------------------------------------------
    # Stage 2: 各ミドルウェアの並行収束待機 & 事後構成 (Converge)
    # --------------------------------------------------------
    - name: "[Stage 2-1/2] Rancher ロールアウト待機 & 事後構成"
      ansible.builtin.include_role:
        name: rancher
        tasks_from: converge.yml
        apply:
          tags:
            - apps
            - rancher
      tags:
        - apps
        - rancher

    - name: "[Stage 2-2/2] Monitoring ロールアウト待機 & ダッシュボード構成"
      ansible.builtin.include_role:
        name: monitoring
        tasks_from: converge.yml
        apply:
          tags:
            - apps
            - monitoring
      tags:
        - apps
        - monitoring

