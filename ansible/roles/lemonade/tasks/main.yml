---
# ==============================================================================
# Lemonade Server (GPU LLM / Ollama 互換 API) ロール
#
# AMD GPU (ROCm) を用いた Lemonade Server を Worker ノードにデプロイし、
# Ollama 互換 API (/api/*) と OpenAI 互換 API (/api/v1) を提供する。
# ローカル Helm チャート ({{ role_path }}/chart) に対して、Single Source of
# Truth (config.env / ansible/group_vars/all.yml) の値を jinja レンダリングした
# values (templates/values-lemonade.yaml.j2) を渡し、helm upgrade --install
# で冪等にデプロイする。
# ==============================================================================

- name: Lemonade 名前空間を作成
  ansible.builtin.command: "kubectl create namespace {{ lemonade_namespace }}"
  register: create_lemonade_ns
  changed_when: "'created' in create_lemonade_ns.stdout"
  failed_when: false

# Ollama → Lemonade 移行前の旧デプロイ (旧名前空間) が残存していると、
# 旧 Pod が GPU を保持したままになり Lemonade Pod が Pending のまま起動できない。
# 残存時にのみ削除し、冪等に動作する (存在しない場合は何もしない)。
- name: 旧 Ollama / OGA 名前空間をクリーンアップ (GPU 概奪防止・冪等)
  ansible.builtin.shell: |
    set -e
    deleted=""
    for ns in {{ legacy_ai_namespaces | default(['ollama', 'oga']) | join(' ') }}; do
      if kubectl get namespace "$ns" >/dev/null 2>&1; then
        echo "旧名前空間 ${ns} を削除中 (旧 Ollama / OGA リソースの残存防止)..."
        kubectl delete namespace "$ns" \
          --ignore-not-found=true --wait=true \
          --timeout={{ legacy_cleanup_timeout | default('180s') }}
        deleted="${deleted} ${ns}"
      fi
    done
    if [ -n "$deleted" ]; then
      echo "deleted_namespaces:${deleted}"
    else
      echo "legacy namespaces: none"
    fi
  register: legacy_cleanup
  changed_when: "'deleted_namespaces:' in legacy_cleanup.stdout"
  when: legacy_cleanup_enabled | default(true) | bool

# kubectl apply で作成された既存リソースを Helm release (lemonade) へ引き継ぐ。
# メタデータのみの冪等パッチのため Pod は再作成されない。
- name: 既存 kubectl 管理リソースを Helm 管理へ adoption (kubectl → Helm 移行用・冪等)
  ansible.builtin.shell: |
    NS={{ lemonade_namespace | quote }}
    SVC={{ lemonade_service_name | default('lemonade') | quote }}
    for res in pvc/lemonade-data deployment/lemonade "service/${SVC}" ingress/lemonade networkpolicy/lemonade-app-protection; do
      if kubectl get "$res" -n "$NS" >/dev/null 2>&1; then
        kubectl label "$res" -n "$NS" app.kubernetes.io/managed-by=Helm --overwrite >/dev/null
        kubectl annotate "$res" -n "$NS" \
          meta.helm.sh/release-name=lemonade \
          meta.helm.sh/release-namespace="$NS" --overwrite >/dev/null
      fi
    done
  changed_when: false

# ---- 変更検出 (冪等性) ----------------------------------------------------
# helm upgrade は入力が同一でも常に新しいリビジョンを生成するため、出力文言や
# リビジョン番号では実質的な変更を判定できない。そこで「レンダリング済みの期待
# マニフェスト」と「デプロイ済みマニフェスト」を正規化 (空白行・行末空白除去) して
# 比較し、実差分がある場合のみ changed とする。
- name: 期待マニフェストをレンダリング (変更検出用)
  ansible.builtin.command: >
    helm template lemonade {{ role_path }}/chart
    --namespace {{ lemonade_namespace }}
    -f -
  args:
    stdin: "{{ lookup('template', 'values-lemonade.yaml.j2') }}"
  register: lemonade_expected_manifest
  changed_when: false

- name: デプロイ済みマニフェストを取得 (変更検出用)
  ansible.builtin.command: >-
    helm get manifest lemonade --namespace {{ lemonade_namespace }}
  register: lemonade_current_manifest
  changed_when: false
  failed_when: false

- name: マニフェスト差分の有無を判定
  ansible.builtin.set_fact:
    lemonade_manifest_changed: >-
      {{ (lemonade_expected_manifest.stdout | regex_replace('(?m)^[ \t]*$', '')
          | regex_replace('\n{2,}', '\n'))
         !=
         ((lemonade_current_manifest.stdout | default('', true))
          | regex_replace('(?m)^[ \t]*$', '')
          | regex_replace('\n{2,}', '\n')) }}

- name: Lemonade を Helm でデプロイ (ローカルチャート)
  ansible.builtin.command: >
    helm upgrade --install lemonade {{ role_path }}/chart
    --namespace {{ lemonade_namespace }}
    -f -
  args:
    stdin: "{{ lookup('template', 'values-lemonade.yaml.j2') }}"
  register: install_lemonade
  changed_when: lemonade_manifest_changed | default(true) | bool

- name: Lemonade Deployment のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status deployment/lemonade
    -n {{ lemonade_namespace }}
    --timeout={{ default_rollout_timeout | default('300s') }}
  register: lemonade_rollout
  until: lemonade_rollout.rc == 0
  retries: "{{ quick_retry_count | default(10) }}"
  delay: "{{ quick_retry_delay | default(5) }}"
  changed_when: false

- name: Lemonade Pod のステータスと GPU 割当を確認
  ansible.builtin.shell: |
    kubectl get pods -n {{ lemonade_namespace }} -o wide
  register: lemonade_pods_status
  changed_when: false

- name: Lemonade Pod ステータスを表示
  ansible.builtin.debug:
    msg: "{{ lemonade_pods_status.stdout_lines | default([]) }}"
