{{- if .Values.networkPolicy.enabled }}
---
# ==========================================================
# Application Plane Protection NetworkPolicy: Lemonade (lemonade)
# ==========================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lemonade-app-protection
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lemonade
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. 同一名前空間内の通信
    - from:
        - podSelector: {}

    # 2. Traefik Ingress (kube-system) からの Lemonade API アクセス
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kubeSystemNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.port }}

    # 3. Open WebUI 名前空間からの推論 API アクセス
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.openWebuiNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}

    # 4. Prometheus 監視基盤からのメトリクススクレイプ許可 (/metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.port }}

  egress:
    # 1. DNS 名前解決 (CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kubeSystemNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 2. 同一名前空間内の通信
    - to:
        - podSelector: {}

    # 3. 外部モデルダウンロード・ROCm バックエンド取得 (HuggingFace / GitHub 等)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.networkPolicy.podmanNetworkCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.httpPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.httpsPort }}
{{- end }}
