---
# ==============================================================================
# Ollama LLM / AI サービス ロール
#
# 公式 Helm チャート (ollama-helm/ollama) を用いて Ollama をデプロイし、
# AMD GPU (ROCm) を用いたローカル LLM 推論基盤を提供する。
# ==============================================================================

- name: Ollama 名前空間を作成
  ansible.builtin.command: "kubectl create namespace {{ ollama_namespace }}"
  register: create_ollama_ns
  changed_when: "'created' in create_ollama_ns.stdout"
  failed_when: false

- name: Ollama NetworkPolicy を適用
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'ollama-networkpolicy.yaml.j2') }}"
  register: apply_ollama_netpol
  changed_when: "'created' in apply_ollama_netpol.stdout or 'configured' in apply_ollama_netpol.stdout"
  when: enable_network_policy | default(true) | bool

- name: Ollama Helm リポジトリを登録 (冪等)
  ansible.builtin.import_tasks: ../../../shared/tasks/helm_repo.yml
  vars:
    helm_repos:
      - name: ollama-helm
        url: "{{ helm_repo_ollama }}"

- name: Ollama を Helm でデプロイ
  ansible.builtin.command: >
    helm upgrade --install ollama ollama-helm/ollama
    --namespace {{ ollama_namespace }}
    --version {{ ollama_chart_version }}
    --force-conflicts
    -f -
  args:
    stdin: "{{ lookup('template', 'values-ollama.yaml.j2') }}"
  register: install_ollama
  changed_when: '''Release "ollama" does not exist'' in install_ollama.stdout or ''has been upgraded'' in install_ollama.stdout'

- name: Ollama Deployment のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status deployment/ollama
    -n {{ ollama_namespace }}
    --timeout={{ default_rollout_timeout | default('300s') }}
  register: ollama_rollout
  until: ollama_rollout.rc == 0
  retries: "{{ quick_retry_count | default(10) }}"
  delay: "{{ quick_retry_delay | default(5) }}"
  changed_when: false

- name: Ollama Prometheus Exporter を適用
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'ollama-exporter.yaml.j2') }}"
  register: apply_ollama_exporter
  changed_when: "'created' in apply_ollama_exporter.stdout or 'configured' in apply_ollama_exporter.stdout"

- name: Ollama Exporter Deployment のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status deployment/ollama-exporter
    -n {{ ollama_namespace }}
    --timeout={{ default_rollout_timeout | default('300s') }}
  register: ollama_exporter_rollout
  until: ollama_exporter_rollout.rc == 0
  retries: "{{ quick_retry_count | default(10) }}"
  delay: "{{ quick_retry_delay | default(5) }}"
  changed_when: false

- name: Ollama Pod のステータスと GPU 割当を確認
  ansible.builtin.shell: |
    kubectl get pods -n {{ ollama_namespace }} -o wide
  register: ollama_pods_status
  changed_when: false

- name: Ollama Pod ステータスを表示
  ansible.builtin.debug:
    msg: "{{ ollama_pods_status.stdout_lines | default([]) }}"
