---
# ==============================================================================
# AMD GPU Device Plugin ロール
#
# ROCm 公式 Helm チャート (amd-gpu) を用いて AMD GPU device plugin をデプロイし、
# クラスタ全ノードの kubelet に amd.com/gpu リソースを宣告させる。
# 前提条件: ホストの amdgpu カーネルドライバ、/dev/kfd・/dev/dri のノードへの
# パススルー (k3d config.yaml で自動提供)。
# ==============================================================================

- name: AMD GPU Helm リポジトリを登録 (冪等)
  ansible.builtin.import_tasks: ../../../shared/tasks/helm_repo.yml
  vars:
    helm_repos:
      - name: amd-gpu-helm
        url: "{{ helm_repo_amd_gpu }}"

- name: AMD GPU Device Plugin を Helm でデプロイ
  ansible.builtin.command: >
    helm upgrade --install amd-gpu amd-gpu-helm/amd-gpu
    --namespace {{ kube_system_namespace }}
    --version {{ amd_gpu_chart_version }}
    --force-conflicts
    -f -
  args:
    stdin: "{{ lookup('template', 'values-amd-gpu.yaml.j2') }}"
  register: install_amd_gpu
  changed_when: '''Release "amd-gpu" does not exist'' in install_amd_gpu.stdout or ''has been upgraded'' in install_amd_gpu.stdout'

- name: AMD GPU Device Plugin DaemonSet のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status daemonset/{{ amd_gpu_daemonset_name }}
    -n {{ kube_system_namespace }}
    --timeout={{ default_rollout_timeout | default('300s') }}
  register: amd_gpu_rollout
  until: amd_gpu_rollout.rc == 0
  retries: "{{ quick_retry_count }}"
  delay: "{{ quick_retry_delay }}"
  changed_when: false

- name: 全ノードの AMD GPU 割当可能リソースを取得
  ansible.builtin.shell: |
    kubectl get nodes -o json | jq -r '.items[] | "\(.metadata.name)\t\(.status.allocatable["amd.com/gpu"] // "-")"'
  register: amd_gpu_allocatable
  changed_when: false

- name: AMD GPU 割当可能リソースの宣告状況を表示
  ansible.builtin.debug:
    msg: "{{ amd_gpu_allocatable.stdout_lines | default([]) }}"

- name: AMD NPU Device Plugin マニフェストを適用
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'amd-npu-device-plugin.yaml.j2') }}"
  register: apply_amd_npu
  changed_when: "'created' in apply_amd_npu.stdout or 'configured' in apply_amd_npu.stdout"
  when: amd_npu_plugin_enabled | default(true) | bool

- name: AMD NPU Device Plugin DaemonSet のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status daemonset/{{ amd_npu_daemonset_name }}
    -n {{ kube_system_namespace }}
    --timeout={{ default_rollout_timeout | default('300s') }}
  register: amd_npu_rollout
  until: amd_npu_rollout.rc == 0
  retries: "{{ quick_retry_count | default(10) }}"
  delay: "{{ quick_retry_delay | default(5) }}"
  changed_when: false
  when: amd_npu_plugin_enabled | default(true) | bool

- name: 全ノードの AMD NPU 割当可能リソースを取得
  ansible.builtin.command: >-
    kubectl get nodes -o custom-columns=NAME:.metadata.name,NPU:.status.allocatable.amd\\.com/npu
  register: amd_npu_allocatable
  changed_when: false
  when: amd_npu_plugin_enabled | default(true) | bool

- name: AMD NPU 割当可能リソースの宣告状況を表示
  ansible.builtin.debug:
    msg: "{{ amd_npu_allocatable.stdout_lines | default([]) }}"
  when: amd_npu_plugin_enabled | default(true) | bool
