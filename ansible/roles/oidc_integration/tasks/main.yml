---
- name: Keycloak サービスのロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/keycloak-keycloak -n {{ keycloak_namespace }} --timeout={{ default_rollout_timeout }}"
  changed_when: false

- name: 既存の Keycloak 設定用一時 Pod があれば削除
  ansible.builtin.command: "kubectl delete pod kc-configure -n {{ default_namespace | default('default') }} --ignore-not-found"
  changed_when: false
  failed_when: false

- name: Keycloak OIDC 一括設定および検証を実行
  ansible.builtin.command: >
    kubectl run kc-configure --rm -i --image={{ oidc_curl_image | default('curlimages/curl') }} --restart=Never -n {{ default_namespace | default('default') }} --command -- /bin/sh
  args:
    stdin: "{{ lookup('template', 'configure-keycloak.sh.j2') }}"
  register: kc_configure_result
  changed_when: "'SUCCESS' in kc_configure_result.stdout"

- name: Keycloak OIDC 設定ログを出力
  ansible.builtin.debug:
    var: kc_configure_result.stdout_lines

# ==========================================================
# Traefik Dashboard Keycloak SSO (oauth2-proxy forwardAuth)
# ==========================================================
- name: oauth2-proxy をデプロイ (Traefik Dashboard Keycloak SSO)
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'oauth2-proxy.yaml.j2') }}"
  register: apply_oauth2_proxy
  changed_when: "'created' in apply_oauth2_proxy.stdout or 'configured' in apply_oauth2_proxy.stdout"
  when: not (disable_traefik | default(false))

- name: oauth2-proxy のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/oauth2-proxy -n {{ kube_system_namespace }} --timeout={{ default_rollout_timeout }}"
  register: oauth2_proxy_rollout
  until: oauth2_proxy_rollout.rc == 0
  retries: "{{ quick_retry_count }}"
  delay: "{{ quick_retry_delay }}"
  changed_when: false
  when: not (disable_traefik | default(false))

- name: Traefik Dashboard を SSO (Keycloak OIDC / oauth2-proxy) に切替
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'traefik-dashboard-sso.yaml.j2') }}"
  register: apply_traefik_sso
  changed_when: "'created' in apply_traefik_sso.stdout or 'configured' in apply_traefik_sso.stdout"
  when: not (disable_traefik | default(false))

- name: 旧 BasicAuth リソースを削除 (SSO 切替後の残骸除去)
  ansible.builtin.shell: |
    kubectl delete secret traefik-dashboard-auth-secret -n {{ kube_system_namespace }} --ignore-not-found
    kubectl delete middleware traefik-dashboard-auth -n {{ kube_system_namespace }} --ignore-not-found
  changed_when: false
  failed_when: false
  when: not (disable_traefik | default(false))

- name: Rancher server-url を設定
  ansible.builtin.command: >
    kubectl patch settings.management.cattle.io server-url --type merge -p '{"value":"https://{{ rancher_hostname }}"}'
  failed_when: false
  changed_when: false


- name: Rancher に Keycloak OIDC AuthConfig を適用 (SSO 有効化)
  ansible.builtin.command: >
    kubectl patch authconfigs.management.cattle.io keycloakoidc --type merge -p '{
      "enabled": true,
      "clientId": "rancher",
      "clientSecret": "{{ rancher_client_secret }}",
      "issuer": "https://{{ keycloak_hostname }}/realms/master",
      "authEndpoint": "https://{{ keycloak_hostname }}/realms/master/protocol/openid-connect/auth",
      "tokenEndpoint": "{{ keycloak_internal_url }}/realms/master/protocol/openid-connect/token",
      "userInfoEndpoint": "{{ keycloak_internal_url }}/realms/master/protocol/openid-connect/userinfo",
      "certsUrl": "{{ keycloak_internal_url }}/realms/master/protocol/openid-connect/certs",
      "rancherUrl": "https://{{ rancher_hostname }}/verify-auth",
      "scope": "openid profile email",
      "groupSearchEnabled": true
    }'
  register: patch_keycloak_authconfig
  until: patch_keycloak_authconfig.rc == 0
  retries: "{{ steady_retry_count }}"
  delay: "{{ steady_retry_delay }}"
  failed_when: false
  changed_when: "'patched' in patch_keycloak_authconfig.stdout"

- name: 予備の汎用 OIDC AuthConfig を無効化 (keycloakoidc との競合防止)
  ansible.builtin.command: >
    kubectl patch authconfigs.management.cattle.io oidc --type merge -p '{"enabled": false}'
  failed_when: false
  changed_when: false

- name: Rancher 管理者グループ ({{ admin_group_name }}) の GlobalRoleBinding を作成
  ansible.builtin.command: >
    kubectl apply -f -
  args:
    stdin: "{{ lookup('template', 'globalrolebinding.yaml.j2') }}"
  failed_when: false
  changed_when: false

- name: Rancher 新規ユーザーへの管理者権限 (admin GlobalRole) 自動付与を設定
  ansible.builtin.command: >
    kubectl patch globalrole admin --type merge -p '{"newUserDefault":true}'
  failed_when: false
  changed_when: false

- name: 既存の Keycloak SSO ユーザーに管理者権限 (admin GlobalRoleBinding) を付与
  ansible.builtin.shell: |
    kubectl get users -o json | jq -r '.items[] | select(.principalIds[]? | startswith("keycloakoidc_user://")) | .metadata.name' | while read -r uid; do
      if [[ -n "$uid" ]]; then
        cat <<EOF | kubectl apply -f -
    apiVersion: management.cattle.io/v3
    kind: GlobalRoleBinding
    metadata:
      name: sso-admin-${uid}
    globalRoleName: admin
    userName: ${uid}
    EOF
      fi
    done
  failed_when: false
  changed_when: false

- name: Rancher 初期セットアップの自動完了 (Bootstrap Pass 不要化 & admin パスワード設定)
  ansible.builtin.shell: |
    USER_ID=$(kubectl get user -l authz.management.cattle.io/bootstrapping=admin-user -o jsonpath='{.items[0].metadata.name}')
    [[ -z "$USER_ID" ]] && exit 0

    # パスワード最小長を 4 に緩和
    kubectl patch setting password-min-length --type merge -p '{"value":"4"}' || true

    # reset-password コマンドで一時パスワードを生成
    TEMP_PASS=$(kubectl exec -n {{ rancher_namespace }} deploy/rancher -c rancher -- reset-password 2>/dev/null | tail -n 1 | tr -d '\r\n')
    [[ -z "$TEMP_PASS" ]] && exit 0

    # API ログインしてトークンを取得
    LOGIN_RESP=$(curl -k -s -X POST https://{{ rancher_hostname }}/v3-public/localProviders/local?action=login \
      -H 'Content-Type: application/json' \
      -d "{\"username\":\"admin\",\"password\":\"$TEMP_PASS\"}")
    TOKEN=$(echo "$LOGIN_RESP" | jq -r '.token // empty')
    [[ -z "$TOKEN" ]] && exit 0

    # admin パスワードを設定
    curl -k -s -X POST "https://{{ rancher_hostname }}/v3/users/${USER_ID}?action=setpassword" \
      -H "Authorization: Bearer $TOKEN" \
      -H "Content-Type: application/json" \
      -d "{\"newPassword\":\"{{ rancher_admin_password }}\"}" || true

    # first-login を false に設定 (初回セットアップ画面をバイパス)
    curl -k -s -X PUT "https://{{ rancher_hostname }}/v3/settings/first-login" \
      -H "Authorization: Bearer $TOKEN" \
      -H "Content-Type: application/json" \
      -d '{"name":"first-login","value":"false"}' || true

    # mustChangePassword を false に設定
    kubectl patch user "$USER_ID" --type merge -p '{"mustChangePassword":false}' || true
  changed_when: false
  failed_when: false

- name: Web UI 管理ツール群 (pgAdmin 4) のロールアウト完了を一括確認
  ansible.builtin.shell: |
    kubectl rollout status deployment/pgadmin -n {{ keycloak_namespace | default('keycloak') }} --timeout={{ default_rollout_timeout }} || true
  changed_when: false
  failed_when: false

- name: secrets.txt を生成
  ansible.builtin.template:
    src: secrets.txt.j2
    dest: "{{ project_root }}/secrets.txt"
    mode: '0600'

- name: 認証情報をコンソールに表示
  ansible.builtin.debug:
    msg: |
      ========================================
      認証・アクセス情報 (Ollama on K3D)
      ========================================

      【Open WebUI (Local AI Chat)】[Worker]
        URL: https://{{ open_webui_hostname }}
        SSO Login: Keycloak OIDC (ワンクリックログイン)
        Default Locale: {{ open_webui_default_locale | default('ja-JP') }}

      【Lemonade (Ollama 互換 LLM API)】[Worker]
        URL: https://{{ lemonade_hostname }}
        Port: {{ lemonade_port | default(11434) }}
        GPU Acceleration: AMD ROCm (GPU)

      【FastFlowLM (OpenAI 互換 NPU API)】[Host]
        Endpoint: http://{{ npu_flm_host_ip }}:{{ npu_flm_port }}/v1
