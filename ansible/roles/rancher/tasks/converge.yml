---
# ==========================================================
# Rancher ロールアウト待機 & 配置収束 (Converge)
# ==========================================================

- name: Rancher のロールアウト完了を待機 (レプリカ収束ポーリング)
  ansible.builtin.shell: |
    DESIRED="{{ rancher_replicas | default(1) }}"
    for i in $(seq 1 {{ rancher_ready_wait_steps }}); do
      READY=$(kubectl get deployment rancher -n {{ rancher_namespace }} -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
      READY=${READY:-0}
      echo "Waiting for Rancher: ${READY}/${DESIRED} replicas ready (step $i/{{ rancher_ready_wait_steps }})..."
      if [ "$READY" -ge "$DESIRED" ] && [ "$DESIRED" -gt 0 ]; then
        echo "Rancher deployment successfully rolled out (${READY}/${DESIRED} ready)."
        kubectl rollout status deployment/rancher -n {{ rancher_namespace }} --timeout={{ default_rollout_timeout }} 2>/dev/null || true
        exit 0
      fi
      sleep {{ quick_retry_delay }}
    done
    echo "ERROR: Timeout waiting for Rancher rollout"
    kubectl get pods -n {{ rancher_namespace }} -l app=rancher -o wide || true
    kubectl describe deployment rancher -n {{ rancher_namespace }} || true
    exit 1
  register: wait_rancher
  changed_when: false
  until: wait_rancher.rc == 0
  retries: "{{ once_retry_count }}"


# --- Rancher 派生コンポーネントの Server ノード配置 ---
- name: rancher-webhook Deployment が作成されるまで待機
  ansible.builtin.shell: |
    for i in $(seq 1 {{ rancher_webhook_wait_steps }}); do
      if kubectl get deployment rancher-webhook -n {{ rancher_namespace }} >/dev/null 2>&1; then
        echo "rancher-webhook Deployment successfully detected (step $i/{{ rancher_webhook_wait_steps }})."
        exit 0
      fi
      sleep {{ default_retry_delay }}
    done
    echo "ERROR: Timeout waiting for rancher-webhook Deployment creation"
    kubectl get pods -n {{ rancher_namespace }} || true
    exit 1
  register: wait_webhook_dep
  until: wait_webhook_dep.rc == 0
  retries: "{{ once_retry_count }}"
  changed_when: false

- name: rancher-webhook を Helm values で更新 (レプリカ数 / サーバーノード配置)
  ansible.builtin.command: >
    helm upgrade rancher-webhook rancher-charts/rancher-webhook
    --namespace {{ rancher_namespace }}
    --reuse-values
    -f -
  args:
    stdin: "{{ lookup('template', 'values-rancher-webhook.yaml.j2') }}"
  failed_when: false
  changed_when: false

- name: rancher-webhook のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/rancher-webhook -n {{ rancher_namespace }} --timeout={{ extended_rollout_timeout }}"
  changed_when: false
  failed_when: false

- name: rancher-webhook サービスのエンドポイントが Ready になるまで待機
  ansible.builtin.shell: |
    for i in $(seq 1 {{ rancher_webhook_eps_wait_steps }}); do
      EPS=$(kubectl get endpoints rancher-webhook -n {{ rancher_namespace }} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
      if [ -n "$EPS" ]; then
        echo "rancher-webhook endpoints ready: $EPS (step $i/{{ rancher_webhook_eps_wait_steps }})."
        exit 0
      fi
      sleep {{ default_retry_delay }}
    done
    echo "ERROR: Timeout waiting for rancher-webhook endpoints"
    kubectl get endpoints rancher-webhook -n {{ rancher_namespace }} || true
    kubectl get pods -n {{ rancher_namespace }} -l app=rancher-webhook || true
    exit 1
  register: wait_webhook_eps
  until: wait_webhook_eps.rc == 0
  retries: "{{ once_retry_count }}"
  changed_when: false

- name: fleet 関連コンポーネントを Helm values で更新 (レプリカ数 / サーバーノード配置)
  ansible.builtin.command: >
    helm upgrade fleet rancher-charts/fleet
    --namespace {{ fleet_namespace }}
    --reuse-values
    -f -
  args:
    stdin: "{{ lookup('template', 'values-fleet.yaml.j2') }}"
  failed_when: false
  changed_when: false

- name: fleet 関連コンポーネントのロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/fleet-controller deployment/gitjob deployment/helmops -n {{ fleet_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: Rancher 本体デプロイをサーバーノード固定に設定 (チャートが nodeSelector 非対応のため kubectl パッチ)
  ansible.builtin.command: >
    kubectl patch deployment rancher
    -n {{ rancher_namespace }}
    --type merge
    -p '{
      "spec": {
        "template": {
          "spec": {
            "nodeSelector": {
              "node-role.kubernetes.io/control-plane": "true"
            }
          }
        }
      }
    }'
  failed_when: false
  changed_when: false

- name: Rancher 本体デプロイのロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/rancher -n {{ rancher_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: system-upgrade-controller をサーバーノード固定に設定
  ansible.builtin.command: >
    kubectl patch deployment system-upgrade-controller
    -n {{ rancher_namespace }}
    --type merge
    -p '{
      "spec": {
        "template": {
          "spec": {
            "nodeSelector": {
              "node-role.kubernetes.io/control-plane": "true"
            }
          }
        }
      }
    }'
  failed_when: false
  changed_when: false

- name: system-upgrade-controller のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/system-upgrade-controller -n {{ rancher_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: fleet-agent へのレプリカ数伝播を待機 (fleet-controller 経由)
  ansible.builtin.command: "kubectl get deployment fleet-agent -n {{ fleet_local_namespace }} -o jsonpath={.spec.replicas}"
  register: fleet_agent_replicas
  until: fleet_agent_replicas.stdout | trim | int == (fleet_replicas | default(1) | int)
  retries: "{{ standard_retry_count | default(20) }}"
  delay: "{{ default_retry_delay | default(5) }}"
  failed_when: false
  changed_when: false

- name: fleet-agent をサーバーノード固定に設定 (cattle-fleet-local-system)
  ansible.builtin.command: >
    kubectl patch deployment fleet-agent
    -n {{ fleet_local_namespace }}
    --type merge
    -p '{
      "spec": {
        "template": {
          "spec": {
            "nodeSelector": {
              "node-role.kubernetes.io/control-plane": "true"
            }
          }
        }
      }
    }'
  failed_when: false
  changed_when: false

- name: fleet-agent のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/fleet-agent -n {{ fleet_local_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: CAPI (Cluster API) コントローラーをサーバーノード配置に設定 (CAPIProvider パッチ)
  ansible.builtin.command: >
    kubectl patch capiproviders.turtles-capi.cattle.io cluster-api
    -n {{ capi_namespace }}
    --type merge
    -p '{
      "spec": {
        "deployment": {
          "replicas": {{ capi_replicas | default(1) }},
          "nodeSelector": {
            "node-role.kubernetes.io/control-plane": "true"
          },
          "affinity": {
            "podAffinity": {
              "preferredDuringSchedulingIgnoredDuringExecution": [
                {
                  "weight": 100,
                  "podAffinityTerm": {
                    "labelSelector": {
                      "matchExpressions": [
                        {"key": "app", "operator": "In", "values": ["rancher"]}
                      ]
                    },
                    "topologyKey": "kubernetes.io/hostname"
                  }
                }
              ]
            },
            "podAntiAffinity": null
          }
        }
      }
    }'
  failed_when: false
  changed_when: false

- name: capi-controller-manager のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/capi-controller-manager -n {{ capi_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: rancher-turtles-controller-manager をサーバーノード配置に設定 (Deployment パッチ)
  ansible.builtin.command: >
    kubectl patch deployment rancher-turtles-controller-manager
    -n {{ turtles_namespace }}
    --type merge
    -p '{
      "spec": {
        "replicas": {{ turtles_replicas | default(1) }},
        "template": {
          "spec": {
            "nodeSelector": {
              "node-role.kubernetes.io/control-plane": "true"
            },
            "affinity": {
              "podAffinity": {
                "preferredDuringSchedulingIgnoredDuringExecution": [
                  {
                    "weight": 100,
                    "podAffinityTerm": {
                      "labelSelector": {
                        "matchExpressions": [
                          {"key": "app", "operator": "In", "values": ["rancher"]}
                        ]
                      },
                      "topologyKey": "kubernetes.io/hostname"
                    }
                  }
                ]
              },
              "podAntiAffinity": null
            }
          }
        }
      }
    }'
  failed_when: false
  changed_when: false

- name: rancher-turtles-controller-manager のロールアウト完了を待機
  ansible.builtin.command: "kubectl rollout status deployment/rancher-turtles-controller-manager -n {{ turtles_namespace }} --timeout={{ default_rollout_timeout }}"
  failed_when: false
  changed_when: false

- name: Traefik ロードバランサー IP を取得
  ansible.builtin.command: "kubectl get svc -n {{ kube_system_namespace }} traefik -o jsonpath='{.status.loadBalancer.ingress[*].ip}'"
  register: lb_ips_raw
  changed_when: false

- name: dnsmasq レコードを設定
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/NetworkManager/dnsmasq.d/rancher.conf
    mode: '0644'
  vars:
    lb_ips: "{{ lb_ips_raw.stdout.split() }}"
  when: lb_ips_raw.stdout | length > 0
  become: true
  notify: Reload NetworkManager

- name: NetworkManager を dnsmasq モードに設定
  ansible.builtin.copy:
    content: |
      [main]
      dns=dnsmasq
    dest: /etc/NetworkManager/conf.d/00-use-dnsmasq.conf
    mode: '0644'
  become: true
  notify: Restart NetworkManager

- name: Rancher Dashboard 日本語化パッチを適用 (i18n 日本語固定)
  ansible.builtin.command: "{{ playbook_dir }}/../../manifests/rancher-i18n/patch-rancher-i18n.sh"
  register: rancher_i18n_patch
  changed_when: "'パッチ適用が完了しました' in rancher_i18n_patch.stdout"
  failed_when: false

- name: ホストの Helm リポジトリを Rancher Apps & Marketplace (ClusterRepo) に同期登録
  ansible.builtin.shell: |
    set -e
    helm repo list 2>/dev/null | awk 'NR>1 {print $1, $2}' | while read -r name url; do
      [ -z "$name" ] && continue
      repo_name="$name"
      if [ "$repo_name" = "rancher-charts" ]; then
        repo_name="rancher-charts-http"
      fi
      printf '%s\n' "---" \
        "apiVersion: catalog.cattle.io/v1" \
        "kind: ClusterRepo" \
        "metadata:" \
        "  name: ${repo_name}" \
        "spec:" \
        "  url: ${url}"
    done | kubectl apply -f -
  register: sync_cluster_repos
  changed_when: "'created' in sync_cluster_repos.stdout"
  failed_when: false

- name: Application Plane (Rancher) 保護 NetworkPolicy を適用
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'rancher-networkpolicy.yaml.j2') }}"
  register: apply_rancher_netpol
  changed_when: "'created' in apply_rancher_netpol.stdout or 'configured' in apply_rancher_netpol.stdout"
  when: enable_network_policy | default(true) | bool

# ==========================================================
# cattle-* 起動待ち合わせ (後続フェーズとの同期ポイント)
# Rancher が管理する全 cattle-* 名前空間 (cattle-system / fleet /
# monitoring / capi / turtles 等) のワークロードが収束し、
# 全 Pod が完全起動 (Ready) するまでブロッキングし、
# Stage 2-2 (監視収束) や Phase 4 (OIDC 統合) との実行競合を防止する。
#   - 対象: cattle_ns_prefix に前方一致する全名前空間の
#           Deployment / DaemonSet / StatefulSet、および全 Pod
#           (終端済み Pod: Completed/Error/Failed、Terminating 中は除外)
#   - 期限: cattle_converge_timeout_seconds (CATTLE_CONVERGE_TIMEOUT_SECONDS)
#   - ポーリング間隔: quick_retry_delay (QUICK_RETRY_DELAY)
# ==========================================================
- name: cattle-* 名前空間のワークロード起動完了を待ち合わせ
  ansible.builtin.shell: |
    set -u
    TIMEOUT_SECONDS={{ cattle_converge_timeout_seconds }}
    POLL_DELAY={{ quick_retry_delay }}
    NS_PREFIX='{{ cattle_ns_prefix }}'
    END=$(( $(date +%s) + TIMEOUT_SECONDS ))

    # cattle-* 名前空間の一覧を取得 (API 一時障害に備えて少数リトライ)
    CATTLE_NS=""
    RETRY=0
    while [ "${RETRY}" -lt {{ quick_retry_count }} ]; do
      CATTLE_NS=$(kubectl get namespaces -o name 2>/dev/null | sed -n 's|^namespace/||p' | grep "^${NS_PREFIX}" || true)
      [ -n "${CATTLE_NS}" ] && break
      RETRY=$((RETRY + 1))
      sleep "${POLL_DELAY}"
    done
    if [ -z "${CATTLE_NS}" ]; then
      echo "ERROR: ${NS_PREFIX}* 名前空間が 1 件も存在しません (Rancher 未デプロイの可能性)"
      exit 1
    fi
    TOTAL=$(echo "${CATTLE_NS}" | wc -l | tr -d ' ')
    echo "待ち合わせ対象: ${TOTAL} 名前空間 [$(echo ${CATTLE_NS} | tr '\n' ' ')] (期限 ${TIMEOUT_SECONDS}s)"

    for NS in ${CATTLE_NS}; do
      # 1) 名前空間が Active になるまで待機
      while true; do
        PHASE=$(kubectl get namespace "${NS}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
        if [ "${PHASE}" = "Active" ]; then
          break
        fi
        if [ "$(date +%s)" -ge "${END}" ]; then
          echo "ERROR: 名前空間 ${NS} が Active になりません (phase=${PHASE})"
          kubectl get namespace "${NS}" -o wide || true
          exit 1
        fi
        echo "  ${NS}: phase=${PHASE} を待機中..."
        sleep "${POLL_DELAY}"
      done

      # 2) 全ワークロード (Deployment / DaemonSet / StatefulSet) の収束を待機
      RESOURCES=$(kubectl get deploy,ds,sts -n "${NS}" -o name 2>/dev/null || true)
      if [ -z "${RESOURCES}" ]; then
        echo "  ${NS}: ワークロードなし (Active 確認済み)"
        continue
      fi
      for RES in ${RESOURCES}; do
        while true; do
          REMAINING=$((END - $(date +%s)))
          if [ "${REMAINING}" -le 0 ]; then
            echo "ERROR: 期限 (${TIMEOUT_SECONDS}s) 内に ${NS}/${RES} がロールアウト完了しませんでした"
            kubectl get "${RES}" -n "${NS}" -o wide || true
            kubectl get pods -n "${NS}" -o wide || true
            exit 1
          fi
          if kubectl rollout status "${RES}" -n "${NS}" --timeout="${REMAINING}s" 2>&1; then
            echo "  ${NS}/${RES}: 収束確認"
            break
          fi
          # 一時的な API エラー等で早期失敗した場合は期限まで再試行する
          if [ "$(date +%s)" -ge "${END}" ]; then
            echo "ERROR: ${NS}/${RES} が期限 (${TIMEOUT_SECONDS}s) 内に収束しませんでした"
            kubectl get "${RES}" -n "${NS}" -o wide || true
            kubectl get pods -n "${NS}" -o wide || true
            exit 1
          fi
          echo "  ${NS}/${RES}: 未収束 (再試行)..."
          sleep "${POLL_DELAY}"
        done
      done
    done
    echo "cattle-* 名前空間 ${TOTAL} 件のワークロード起動完了を確認しました。"

    # 3) 全名前空間の Pod 完全起動 (Ready) を待機
    #    終端済み Pod (Completed/Error/Failed) と Terminating 中は
    #    対象外 (helm 操作の一時 Pod は終了状態のまま残存するため)
    while true; do
      NOT_READY=""
      for NS in ${CATTLE_NS}; do
        BAD=$(kubectl get pods -n "${NS}" --no-headers 2>/dev/null | awk '{
          if ($3 == "Completed" || $3 == "Error" || $3 == "Failed" || $3 == "Terminating") next
          split($2, a, "/")
          if ($3 != "Running" || a[1] != a[2] || a[2] + 0 < 1) print $1 " (" $2 " " $3 ")"
        }')
        if [ -n "${BAD}" ]; then
          NOT_READY="${NOT_READY} ${NS}: $(echo "${BAD}" | tr '\n' '|')"
        fi
      done
      if [ -z "${NOT_READY}" ]; then
        echo "cattle-* 全名前空間の Pod 完全起動 (Ready) を確認しました。"
        break
      fi
      if [ "$(date +%s)" -ge "${END}" ]; then
        echo "ERROR: 期限 (${TIMEOUT_SECONDS}s) 内に Pod が完全起動しませんでした:${NOT_READY}"
        for NS in ${CATTLE_NS}; do
          kubectl get pods -n "${NS}" -o wide || true
        done
        exit 1
      fi
      echo "  未 Ready Pod:${NOT_READY}"
      sleep "${POLL_DELAY}"
    done
  register: cattle_converge_wait
  changed_when: false

