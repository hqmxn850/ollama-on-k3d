---
# ==============================================================================
# Open WebUI (Local AI Web チャット基盤) ロール
#
# 公式 Helm チャート (open-webui/open-webui) を用いてデプロイし、
# Ollama / OGA バックエンドおよび Keycloak OIDC 認証と連携した Web UI を提供する。
# ==============================================================================

- name: Open WebUI 名前空間を作成
  ansible.builtin.command: "kubectl create namespace {{ open_webui_namespace }}"
  register: create_open_webui_ns
  changed_when: "'created' in create_open_webui_ns.stdout"
  failed_when: false

- name: Open WebUI NetworkPolicy を適用
  ansible.builtin.command: "kubectl apply -f -"
  args:
    stdin: "{{ lookup('template', 'open-webui-networkpolicy.yaml.j2') }}"
  register: apply_open_webui_netpol
  changed_when: "'created' in apply_open_webui_netpol.stdout or 'configured' in apply_open_webui_netpol.stdout"
  when: enable_network_policy | default(true) | bool

- name: Open WebUI Helm リポジトリを登録 (冪等)
  ansible.builtin.import_tasks: ../../../shared/tasks/helm_repo.yml
  vars:
    helm_repos:
      - name: open-webui
        url: "{{ helm_repo_open_webui }}"

- name: Open WebUI を Helm でデプロイ
  ansible.builtin.command: >
    helm upgrade --install open-webui open-webui/open-webui
    --namespace {{ open_webui_namespace }}
    --version {{ open_webui_chart_version }}
    --force-conflicts
    -f -
  args:
    stdin: "{{ lookup('template', 'values-open-webui.yaml.j2') }}"
  register: install_open_webui
  changed_when: '''Release "open-webui" does not exist'' in install_open_webui.stdout or ''has been upgraded'' in install_open_webui.stdout'

- name: Open WebUI StatefulSet のロールアウト完了を待機
  ansible.builtin.command: >-
    kubectl rollout status statefulset/open-webui
    -n {{ open_webui_namespace }}
    --timeout={{ open_webui_rollout_timeout | default('300s') }}
  register: open_webui_rollout
  until: open_webui_rollout.rc == 0
  retries: "{{ quick_retry_count | default(10) }}"
  delay: "{{ quick_retry_delay | default(5) }}"
  changed_when: false

- name: Open WebUI Pod のステータスを確認
  ansible.builtin.command: >-
    kubectl get pods -n {{ open_webui_namespace }} -o wide
  register: open_webui_pods_status
  changed_when: false

- name: Open WebUI Pod ステータスを表示
  ansible.builtin.debug:
    msg: "{{ open_webui_pods_status.stdout_lines | default([]) }}"

- name: Ensure custom functions and tools directories exist in Open WebUI Pod
  ansible.builtin.shell: |
    kubectl exec -i -n {{ open_webui_namespace }} statefulset/open-webui -c open-webui -- mkdir -p /app/backend/data/custom_functions /app/backend/data/custom_tools
  changed_when: false

- name: Copy custom functions to Open WebUI Pod
  ansible.builtin.shell: |
    kubectl cp "{{ role_path }}/files/functions/." "{{ open_webui_namespace }}/open-webui-0:/app/backend/data/custom_functions/"
  changed_when: false

- name: Copy custom tools to Open WebUI Pod
  ansible.builtin.shell: |
    kubectl cp "{{ role_path }}/files/tools/." "{{ open_webui_namespace }}/open-webui-0:/app/backend/data/custom_tools/"
  changed_when: false

- name: Open WebUI ロケールおよびインターフェース・Web検索設定を DB に反映
  ansible.builtin.command: >-
    kubectl exec -i -n {{ open_webui_namespace }} statefulset/open-webui -c open-webui --
    sh -c 'cd /app/backend && WEBUI_SECRET_KEY="${WEBUI_SECRET_KEY:-open-webui-config-setup}" python3 - "$@"'
    sh "{{ open_webui_default_locale | default('ja-JP') }}" "{{ open_webui_web_search_enabled | default(true) | string }}" "{{ open_webui_web_search_engine | default('duckduckgo') }}" "{{ open_webui_web_search_result_count | default(3) }}" "{{ open_webui_web_search_concurrent_requests | default(10) }}" "{{ open_webui_web_search_bypass_web_loader | default(true) | string }}" "{{ open_webui_web_search_bypass_embedding_and_retrieval | default(true) | string }}" "{{ open_webui_google_drive_integration_enabled | default(false) | string }}" "{{ open_webui_google_drive_client_id | default('') }}" "{{ open_webui_google_drive_api_key | default('') }}"
  args:
    stdin: |
      import asyncio
      import json
      import os
      import re
      import sqlite3
      import sys
      from open_webui.models.config import Config

      # -------------------------------------------------------------------------
      # 0. PostgreSQL 接続時: 既存 SQLite (webui.db) からの自動データ移行 (マイグレーション)
      # -------------------------------------------------------------------------
      try:
          from open_webui.internal.db import engine, SessionLocal
          from sqlalchemy import text, inspect, Boolean
          sqlite_path = "/app/backend/data/webui.db"
          if engine and "postgresql" in str(engine.url) and os.path.exists(sqlite_path):
              conn_sq = sqlite3.connect(sqlite_path)
              conn_sq.row_factory = sqlite3.Row
              c_sq = conn_sq.cursor()
              inspector = inspect(engine)
              migration_tables = ["user", "auth", "chat", "chat_message", "tag", "tool", "function"]
              with SessionLocal() as session:
                  for tbl in migration_tables:
                      try:
                          res = session.execute(text(f'SELECT count(*) FROM "{tbl}"')).scalar()
                          if res == 0:
                              sq_rows = c_sq.execute(f'SELECT * FROM "{tbl}"').fetchall()
                              if sq_rows:
                                  pg_cols = {col["name"]: col["type"] for col in inspector.get_columns(tbl)}
                                  cols = [c for c in sq_rows[0].keys() if c in pg_cols]
                                  cols_str = ', '.join([f'"{col}"' for col in cols])
                                  vals_str = ', '.join([f':{col}' for col in cols])
                                  insert_sql = text(f'INSERT INTO "{tbl}" ({cols_str}) VALUES ({vals_str}) ON CONFLICT DO NOTHING')
                                  for row in sq_rows:
                                      row_dict = {}
                                      for col in cols:
                                          val = row[col]
                                          col_type = pg_cols.get(col)
                                          if isinstance(col_type, Boolean) and val is not None:
                                              val = bool(val)
                                          row_dict[col] = val
                                      session.execute(insert_sql, row_dict)
                                  session.commit()
                                  print(f"Migrated {len(sq_rows)} rows from SQLite into PostgreSQL {tbl}")
                      except Exception as mex:
                          session.rollback()
                          print(f"Warning: Failed to migrate table {tbl} from SQLite: {mex}")
              conn_sq.close()
      except Exception as ex:
          print(f"Warning: SQLite to PostgreSQL migration error: {ex}")

      locale = sys.argv[1]
      web_search_enabled = sys.argv[2] if len(sys.argv) > 2 else "True"
      web_search_engine = sys.argv[3] if len(sys.argv) > 3 else "duckduckgo"
      try:
          web_search_count = int(sys.argv[4]) if len(sys.argv) > 4 else 3
      except Exception:
          web_search_count = 3
      try:
          web_search_concurrent = int(sys.argv[5]) if len(sys.argv) > 5 else 10
      except Exception:
          web_search_concurrent = 10
      bypass_web_loader = sys.argv[6] if len(sys.argv) > 6 else "True"
      bypass_embedding = sys.argv[7] if len(sys.argv) > 7 else "True"
      gdrive_enabled = sys.argv[8] if len(sys.argv) > 8 else "False"
      gdrive_client_id = sys.argv[9] if len(sys.argv) > 9 else ""
      gdrive_api_key = sys.argv[10] if len(sys.argv) > 10 else ""

      asyncio.run(Config.upsert({
          "ui.default_locale": locale,
          "ui.default_interface_settings": {"locale": locale, "webSearch": "always"},
          "web.search.enable": (web_search_enabled.lower() == "true"),
          "web.search.engine": web_search_engine,
          "web.search.result_count": web_search_count,
          "web.search.concurrent_requests": web_search_concurrent,
          "web.search.bypass_web_loader": (bypass_web_loader.lower() == "true"),
          "web.search.bypass_embedding_and_retrieval": (bypass_embedding.lower() == "true"),
          "web.search.ddgs_backend": "auto",
          "google_drive.enable": (gdrive_enabled.lower() == "true"),
          "google_drive.client_id": gdrive_client_id,
          "google_drive.api_key": gdrive_api_key,
      }))
      print("ui.default_locale =", asyncio.run(Config.get("ui.default_locale")))
      print("ui.default_interface_settings =", asyncio.run(Config.get("ui.default_interface_settings")))
      print("web.search.enable =", asyncio.run(Config.get("web.search.enable")))
      print("web.search.engine =", asyncio.run(Config.get("web.search.engine")))
      print("web.search.bypass_web_loader =", asyncio.run(Config.get("web.search.bypass_web_loader")))
      print("web.search.bypass_embedding_and_retrieval =", asyncio.run(Config.get("web.search.bypass_embedding_and_retrieval")))
      print("google_drive.enable =", asyncio.run(Config.get("google_drive.enable")))

      try:
          from open_webui.models.users import Users
          async def update_users():
              users_data = await Users.get_users()
              users_list = users_data.get("users", []) if isinstance(users_data, dict) else users_data
              for u in users_list:
                  uid = getattr(u, "id", None) or (u.get("id") if isinstance(u, dict) else None)
                  raw_settings = getattr(u, "settings", None) or (u.get("settings") if isinstance(u, dict) else None)
                  try:
                      s = json.loads(raw_settings) if isinstance(raw_settings, str) else (raw_settings or {})
                  except Exception:
                      s = {}
                  if not isinstance(s, dict):
                      s = {}
                  ui = s.get("ui")
                  if not isinstance(ui, dict):
                      ui = {}
                  ui["locale"] = locale
                  ui["webSearch"] = "always"
                  s["ui"] = ui
                  if uid:
                      await Users.update_user_by_id(uid, {"settings": s})
          asyncio.run(update_users())
      except Exception as e:
          print(f"Warning: Failed to update existing user settings via ORM: {e}")

      try:
          if os.path.exists("/app/backend/data/webui.db"):
              conn = sqlite3.connect("/app/backend/data/webui.db")
              c = conn.cursor()
              users = c.execute("SELECT id, settings FROM user").fetchall()
              for uid, raw_settings in users:
                  try:
                      s = json.loads(raw_settings) if raw_settings else {}
                  except Exception:
                      s = {}
                  if not isinstance(s, dict):
                      s = {}
                  ui = s.get("ui")
                  if not isinstance(ui, dict):
                      ui = {}
                  ui["locale"] = locale
                  ui["webSearch"] = "always"
                  s["ui"] = ui
                  c.execute("UPDATE user SET settings = ? WHERE id = ?", (json.dumps(s), uid))
              conn.commit()
              conn.close()
      except Exception as e:
          pass

      try:
          html_path = "/app/build/index.html"
          if os.path.exists(html_path):
              with open(html_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'<html lang="[^"]*"', f'<html lang="{locale}"', content)
              content = content.replace('src="/static/loader.js" defer', 'src="/static/loader.js"')
              with open(html_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched index.html language attribute and synchronous loader script")
      except Exception as e:
          print(f"Warning: Failed to patch index.html: {e}")

      try:
          import glob
          files = glob.glob("/app/build/_app/immutable/nodes/0.*.js")
          target = '!localStorage.locale){const f=await po(),_=navigator.languages?navigator.languages:[navigator.language||navigator.userLanguage],te=J!=null&&J.default_locale?J.default_locale:So(f,_,"en-US");await ho(te),Io.locale(te)}'
          repl = '(!localStorage.locale||localStorage.locale==="en-US"||localStorage.locale==="en"||localStorage.locale==="' + locale + '"))' + chr(123) + 'const f=await po(),_=navigator.languages?navigator.languages:[navigator.language||navigator.userLanguage],te=J!=null&&J.default_locale?J.default_locale:"' + locale + '";localStorage.setItem("locale",te);await ho(te),Io.locale(te)' + chr(125)
          for f in files:
              with open(f, "r", encoding="utf-8") as fp:
                  c = fp.read()
              if target in c:
                  c = c.replace(target, repl)
                  with open(f, "w", encoding="utf-8") as fp:
                      fp.write(c)
                  print(f"Patched frontend locale enforcement in {os.path.basename(f)}")
      except Exception as e:
          print(f"Warning: Failed to patch frontend locale: {e}")


      try:
          import glob
          from open_webui.models.functions import Functions, FunctionForm, FunctionMeta
          from open_webui.models.tools import Tools, ToolForm, ToolMeta
          from open_webui.models.users import Users
          from open_webui.models.models import Models, ModelForm, ModelMeta, ModelParams
          from open_webui.utils.tools import load_tool_module_by_id, get_tool_specs

          def parse_metadata(content: str):
              title = None
              desc = ""
              doc_match = re.search(r'"""(.*?)"""', content, re.DOTALL)
              if doc_match:
                  doc = doc_match.group(1)
                  for line in doc.splitlines():
                      line = line.strip()
                      if line.startswith("title:"):
                          title = line.split("title:", 1)[1].strip()
                      elif line.startswith("description:"):
                          desc = line.split("description:", 1)[1].strip()
              return title, desc

          async def sync_custom_plugins():
              users_data = await Users.get_users()
              users_list = users_data.get("users", []) if isinstance(users_data, dict) else users_data
              admin_id = None
              for u in users_list:
                  role = getattr(u, "role", "") or (u.get("role") if isinstance(u, dict) else "")
                  if role == "admin":
                      admin_id = getattr(u, "id", None) or (u.get("id") if isinstance(u, dict) else None)
                      break
              if not admin_id and users_list:
                  admin_id = getattr(users_list[0], "id", None) or (users_list[0].get("id") if isinstance(users_list[0], dict) else None)
              admin_id = admin_id or "system"

              # 1. Sync Functions (Filters and Pipes)
              fn_files = glob.glob("/app/backend/data/custom_functions/*.py")
              for fpath in sorted(fn_files):
                  fid = os.path.splitext(os.path.basename(fpath))[0]
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()

                  title, desc = parse_metadata(content)
                  name = title or fid.replace("_", " ").title()
                  ftype = "pipe" if "class Pipe" in content else "filter"

                  existing = await Functions.get_function_by_id(fid)
                  form = FunctionForm(
                      id=fid,
                      name=name,
                      content=content,
                      meta=FunctionMeta(description=desc)
                  )
                  if existing:
                      await Functions.update_function_by_id(fid, {
                          "name": name,
                          "content": content,
                          "meta": {"description": desc},
                          "is_active": True,
                          "is_global": True
                      })
                      print(f"Updated function: {fid} ({name}) [{ftype}]")
                  elif admin_id:
                      await Functions.insert_new_function(admin_id, ftype, form)
                      await Functions.update_function_by_id(fid, {
                          "is_active": True,
                          "is_global": True
                      })
                      print(f"Inserted function: {fid} ({name}) [{ftype}]")

              # 2. Sync Tools
              tool_files = glob.glob("/app/backend/data/custom_tools/*.py")
              all_tool_ids = []
              for tpath in sorted(tool_files):
                  tid = os.path.splitext(os.path.basename(tpath))[0]
                  all_tool_ids.append(tid)
                  with open(tpath, "r", encoding="utf-8") as f:
                      content = f.read()

                  title, desc = parse_metadata(content)
                  name = title or tid.replace("_", " ").title()

                  try:
                      module, _ = await load_tool_module_by_id(tid, content=content)
                      specs = get_tool_specs(module)
                  except Exception as e:
                      print(f"Error loading specs for tool {tid}: {e}")
                      specs = []

                  existing = await Tools.get_tool_by_id(tid)
                  form = ToolForm(
                      id=tid,
                      name=name,
                      content=content,
                      meta=ToolMeta(description=desc),
                      access_grants=[]
                  )
                  if existing:
                      await Tools.update_tool_by_id(tid, {
                          "name": name,
                          "content": content,
                          "specs": specs,
                          "meta": {"description": desc}
                      })
                      print(f"Updated tool: {tid} ({name})")
                  elif admin_id:
                      await Tools.insert_new_tool(admin_id, form, specs=specs)
                      print(f"Inserted tool: {tid} ({name})")

              # 3. Configure default models with toolIds
              try:
                  default_model = await Config.get("ui.default_models")
                  if default_model:
                      for mid in default_model.split(","):
                          mid = mid.strip()
                          if mid:
                              mform = ModelForm(
                                  id=mid,
                                  base_model_id=None,
                                  name=mid,
                                  meta=ModelMeta(
                                      description=f"{mid} with Tools capabilities",
                                      capabilities={"tools": True, "web_search": True},
                                      toolIds=all_tool_ids
                                  ),
                                  params=ModelParams(),
                                  access_grants=[],
                                  is_active=True
                              )
                              m_exist = await Models.get_model_by_id(mid)
                              if m_exist:
                                  await Models.update_model_by_id(mid, mform)
                              elif admin_id:
                                  await Models.insert_new_model(mform, admin_id)
                              print(f"Configured model {mid} with default toolIds: {all_tool_ids}")
              except Exception as e:
                  print(f"Warning: Failed to configure default model with toolIds: {e}")

          asyncio.run(sync_custom_plugins())
      except Exception as e:
          print(f"Warning: Failed to register functions and tools: {e}")

      # Patch frontend to enable Web Search (globe icon) by default
      try:
          import glob
          js_files = glob.glob("/app/build/_app/immutable/chunks/*.js")
          for js_path in js_files:
              with open(js_path, "r", encoding="utf-8") as f:
                  content = f.read()
              c_changed = False
              if "webSearchEnabled" in content:
                  new_content, count = re.subn(r'("webSearchEnabled",\s*\d+,\s*)!1', r'\g<1>!0', content)
                  if count > 0:
                      content = new_content
                      c_changed = True
              if "q.webSearchEnabled??!1" in content:
                  content = content.replace("q.webSearchEnabled??!1", "q.webSearchEnabled??!0")
                  c_changed = True
              if c_changed:
                  with open(js_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched webSearchEnabled defaults to true in {os.path.basename(js_path)}")
      except Exception as e:
          print(f"Warning: Failed to patch frontend webSearchEnabled defaults: {e}")

      # Patch backend middleware to auto-enable web_search and inherit toolIds
      try:
          mw_path = "/app/backend/open_webui/utils/middleware.py"
          if os.path.exists(mw_path):
              with open(mw_path, "r", encoding="utf-8") as f:
                  content = f.read()
              changed = False
              # Native FC 有効時でも RAG Web 検索を実行するようパッチ
              target_rag = "                # Skip forced RAG web search when native FC is enabled - model can use web_search tool\n                if metadata.get('params', {}).get('function_calling') == 'legacy':\n                    form_data = await chat_web_search_handler(request, form_data, extra_params, user)"
              repl_rag = "                # Execute RAG web search when web_search feature is requested (even if native FC enabled)\n                form_data = await chat_web_search_handler(request, form_data, extra_params, user)"
              if target_rag in content:
                  content = content.replace(target_rag, repl_rag)
                  changed = True

              mw_target1 = "    features = form_data.pop('features', None) or {}\n    extra_params['__features__'] = features"
              mw_repl1 = "    features = form_data.pop('features', None) or {}\n    if 'web_search' not in features and await Config.get('web.search.enable'):\n        features['web_search'] = True\n    extra_params['__features__'] = features"
              if mw_target1 in content:
                  content = content.replace(mw_target1, mw_repl1)
                  changed = True

              mw_target2 = "        # Server side tools\n        tool_ids = metadata.get('tool_ids', None)"
              mw_repl2 = "        # Server side tools\n        tool_ids = metadata.get('tool_ids', None)\n        if not tool_ids and task_model_id in models:\n            tool_ids = list(models[task_model_id].get('info', {}).get('meta', {}).get('toolIds') or [])"
              if mw_target2 in content:
                  content = content.replace(mw_target2, mw_repl2)
                  changed = True

              if changed:
                  with open(mw_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Patched backend middleware for default web_search, RAG bypass override, and toolIds")
      except Exception as e:
          print(f"Warning: Failed to patch backend middleware: {e}")
  register: open_webui_locale_setup
  changed_when: false
  retries: "{{ quick_retry_count | default(5) }}"
  delay: "{{ quick_retry_delay | default(3) }}"
  until: open_webui_locale_setup.rc == 0



