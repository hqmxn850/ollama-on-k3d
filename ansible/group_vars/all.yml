---
# クラスタ設定
cluster_name: "{{ lookup('env', 'CLUSTER_NAME') | default('ollama-cluster', true) }}"
servers: "{{ lookup('env', 'SERVERS') | default(1, true) | int }}"
agents: "{{ lookup('env', 'AGENTS') | default(1, true) | int }}"
server_cpus: "{{ lookup('env', 'SERVER_CPUS') | default(8, true) | int }}"
agent_cpus: "{{ lookup('env', 'AGENT_CPUS') | default(24, true) | int }}"
server_cpuset: "{{ lookup('env', 'SERVER_CPUSET') | default('0-7', true) }}"
agent_cpuset: "{{ lookup('env', 'AGENT_CPUSET') | default('8-31', true) }}"

# K3s イメージ (versions.env の IMAGE が正。env 未設定時のフォールバックのみ)
k3s_image: "{{ lookup('env', 'IMAGE') | default('rancher/k3s:v1.36.4-k3s1', true) }}"

# ネットワーク・CIDR・IP 設定
podman_network: "{{ lookup('env', 'NETWORK') | default('k3d', true) }}"
podman_network_cidr: "{{ lookup('env', 'PODMAN_NETWORK_CIDR') | default('10.89.0.0/24', true) }}"
podman_network_gateway: "{{ lookup('env', 'PODMAN_NETWORK_GATEWAY') | default('10.89.0.1', true) }}"
cluster_dns_ip: "{{ lookup('env', 'CLUSTER_DNS_IP') | default('127.0.0.1', true) }}"
k8s_service_cidr: "{{ lookup('env', 'K8S_SERVICE_CIDR') | default('10.43.0.0/16', true) }}"
k8s_cluster_cidr: "{{ lookup('env', 'K8S_CLUSTER_CIDR') | default('10.42.0.0/16', true) }}"
k8s_node_cidr_mask_size: "{{ lookup('env', 'K8S_NODE_CIDR_MASK_SIZE') | default(24, true) | int }}"
any_cidr: "0.0.0.0/0"
enable_network_policy: "{{ lookup('env', 'ENABLE_NETWORK_POLICY') | default(true, true) | bool }}"

# 名前空間設定 (Single Source of Truth)
keycloak_namespace: "keycloak"
rancher_namespace: "cattle-system"
monitoring_namespace: "cattle-monitoring-system"
cert_manager_namespace: "cert-manager"
fleet_namespace: "cattle-fleet-system"
fleet_local_namespace: "cattle-fleet-local-system"
capi_namespace: "cattle-capi-system"
turtles_namespace: "cattle-turtles-system"
kube_system_namespace: "kube-system"
ollama_namespace: "ollama"
oga_namespace: "oga"
open_webui_namespace: "{{ lookup('env', 'OPEN_WEBUI_NAMESPACE') | default('open-webui', true) }}"
default_namespace: "default"

# 共通タイムアウト設定 (config.env のタイミング変数と連携: lookup + default)
default_rollout_timeout: "{{ lookup('env', 'DEFAULT_ROLLOUT_TIMEOUT') | default('300s', true) }}"
extended_rollout_timeout: "{{ lookup('env', 'EXTENDED_ROLLOUT_TIMEOUT') | default('600s', true) }}"
long_rollout_timeout: "{{ lookup('env', 'LONG_ROLLOUT_TIMEOUT') | default('1200s', true) }}"
helm_timeout: "{{ lookup('env', 'HELM_TIMEOUT') | default('15m', true) }}"
node_ready_timeout: "{{ lookup('env', 'NODE_READY_TIMEOUT') | default('300s', true) }}"
k3d_create_timeout: "{{ lookup('env', 'K3D_CREATE_TIMEOUT') | default('300s', true) }}"
k3d_gpus: "{{ lookup('env', 'K3D_GPUS') | default('all', true) }}"
pod_delete_timeout: "{{ lookup('env', 'POD_DELETE_TIMEOUT') | default('30s', true) }}"

# 共通リトライ階層 (全タスクの retries / delay は必ず本階層から参照する)
default_retry_count: "{{ lookup('env', 'DEFAULT_RETRY_COUNT') | default(60, true) | int }}"
default_retry_delay: "{{ lookup('env', 'DEFAULT_RETRY_DELAY') | default(5, true) | int }}"
quick_retry_count: "{{ lookup('env', 'QUICK_RETRY_COUNT') | default(3, true) | int }}"
quick_retry_delay: "{{ lookup('env', 'QUICK_RETRY_DELAY') | default(10, true) | int }}"
steady_retry_count: "{{ lookup('env', 'STEADY_RETRY_COUNT') | default(5, true) | int }}"
steady_retry_delay: "{{ lookup('env', 'STEADY_RETRY_DELAY') | default(15, true) | int }}"
standard_retry_count: "{{ lookup('env', 'STANDARD_RETRY_COUNT') | default(20, true) | int }}"
standard_retry_delay: "{{ lookup('env', 'STANDARD_RETRY_DELAY') | default(5, true) | int }}"
once_retry_count: "{{ lookup('env', 'ONCE_RETRY_COUNT') | default(1, true) | int }}"

# curl 接続制御 (config.env 連携)
curl_connect_timeout: "{{ lookup('env', 'CURL_CONNECT_TIMEOUT') | default(5, true) | int }}"
curl_max_time: "{{ lookup('env', 'CURL_MAX_TIME') | default(10, true) | int }}"
curl_retry_count: "{{ lookup('env', 'CURL_RETRY_COUNT') | default(3, true) | int }}"
curl_retry_delay: "{{ lookup('env', 'CURL_RETRY_DELAY') | default(2, true) | int }}"
curl_download_max_time: "{{ lookup('env', 'CURL_DOWNLOAD_MAX_TIME') | default(60, true) | int }}"

# ポーリング間隔・待機ステップ数 (Ansible 内部ゲイン制御・group_vars 専用)
default_poll_interval: 2
short_poll_interval: 3
node_ready_wait_steps: 60
rancher_ready_wait_steps: 120
rancher_webhook_wait_steps: 120
rancher_webhook_eps_wait_steps: 60

# ポート番号設定 (Single Source of Truth)
k8s_api_port: "{{ lookup('env', 'K8S_API_PORT') | default(6443, true) | int }}"
host_port: "{{ k8s_api_port }}"
http_port: "{{ lookup('env', 'HTTP_PORT') | default(80, true) | int }}"
https_port: "{{ lookup('env', 'HTTPS_PORT') | default(443, true) | int }}"
dns_port: "{{ lookup('env', 'DNS_PORT') | default(53, true) | int }}"
dns_metrics_port: "{{ lookup('env', 'DNS_METRICS_PORT') | default(9153, true) | int }}"
kubelet_port: "{{ lookup('env', 'KUBELET_PORT') | default(10250, true) | int }}"
metrics_server_port: "{{ lookup('env', 'METRICS_SERVER_PORT') | default(4443, true) | int }}"
traefik_admin_port: "{{ lookup('env', 'TRAEFIK_ADMIN_PORT') | default(8080, true) | int }}"
traefik_ping_port: "{{ lookup('env', 'TRAEFIK_PING_PORT') | default(9000, true) | int }}"
traefik_metrics_port: "{{ lookup('env', 'TRAEFIK_METRICS_PORT') | default(9100, true) | int }}"
traefik_container_http_port: "{{ lookup('env', 'TRAEFIK_CONTAINER_HTTP_PORT') | default(8000, true) | int }}"
traefik_container_https_port: "{{ lookup('env', 'TRAEFIK_CONTAINER_HTTPS_PORT') | default(8443, true) | int }}"
keycloak_http_port: "{{ lookup('env', 'KEYCLOAK_HTTP_PORT') | default(8080, true) | int }}"
keycloak_mgmt_port: "{{ lookup('env', 'KEYCLOAK_MGMT_PORT') | default(9000, true) | int }}"
postgres_port: "{{ lookup('env', 'POSTGRES_PORT') | default(5432, true) | int }}"
postgres_exporter_port: "{{ lookup('env', 'POSTGRES_EXPORTER_PORT') | default(9187, true) | int }}"
rancher_webhook_port: "{{ lookup('env', 'RANCHER_WEBHOOK_PORT') | default(9443, true) | int }}"
grafana_port: "{{ lookup('env', 'GRAFANA_PORT') | default(3000, true) | int }}"
prometheus_port: "{{ lookup('env', 'PROMETHEUS_PORT') | default(9090, true) | int }}"
alertmanager_port: "{{ lookup('env', 'ALERTMANAGER_PORT') | default(9093, true) | int }}"
oauth2_proxy_port: "{{ lookup('env', 'OAUTH2_PROXY_PORT') | default(4180, true) | int }}"
oauth2_proxy_metrics_port: "{{ lookup('env', 'OAUTH2_PROXY_METRICS_PORT') | default(4181, true) | int }}"
k8s_metrics_proxy_port: "{{ lookup('env', 'K8S_METRICS_PROXY_PORT') | default(10240, true) | int }}"

# K3s 設定
disable_traefik: "{{ lookup('env', 'DISABLE_TRAEFIK') | default(false, true) | bool }}"
kubelet_user_namespace: "{{ lookup('env', 'KUBELET_USER_NAMESPACE') | default(true, true) | bool }}"
# k3s datastore が etcd の場合 (SERVERS > 1) のみ true。sqlite datastore では etcd が無いため false
k3s_etcd_metrics_enabled: "{{ lookup('env', 'K3S_ETCD_METRICS_ENABLED') | default(false, true) | bool }}"

# 単一レプリカ・リソース設定
traefik_replicas: "{{ lookup('env', 'TRAEFIK_REPLICAS') | default(1, true) | int }}"
traefik_pod_metrics_port: "{{ lookup('env', 'TRAEFIK_POD_METRICS_PORT') | default(8082, true) | int }}"
webhook_replicas: "{{ lookup('env', 'WEBHOOK_REPLICAS') | default(1, true) | int }}"
fleet_replicas: "{{ lookup('env', 'FLEET_REPLICAS') | default(1, true) | int }}"
capi_replicas: "{{ lookup('env', 'CAPI_REPLICAS') | default(1, true) | int }}"
turtles_replicas: "{{ lookup('env', 'TURTLES_REPLICAS') | default(1, true) | int }}"

# メールドメイン
email_domain: "{{ lookup('env', 'EMAIL_DOMAIN') | default('philippines.com.ph', true) }}"

# Traefik Dashboard 設定 (Keycloak OIDC SSO / oauth2-proxy forwardAuth)
traefik_hostname: "{{ lookup('env', 'TRAEFIK_HOSTNAME') | default('traefik.' ~ email_domain, true) }}"
traefik_admin_user: "{{ lookup('env', 'TRAEFIK_ADMIN_USER') | default('admin', true) }}"
traefik_admin_password: "{{ lookup('env', 'TRAEFIK_ADMIN_PASSWORD') | default('admin', true) }}"
traefik_client_secret: "{{ lookup('env', 'TRAEFIK_CLIENT_SECRET') | default('traefik-secret', true) }}"
oauth2_proxy_image: "{{ lookup('env', 'OAUTH2_PROXY_IMAGE') | default('quay.io/oauth2-proxy/oauth2-proxy:v7.8.1', true) }}"
oauth2_proxy_cookie_secret: "{{ lookup('env', 'OAUTH2_PROXY_COOKIE_SECRET') | default('k3d-traefik-sso-cookie-secret-32', true) }}"
oauth2_proxy_replicas: "{{ lookup('env', 'OAUTH2_PROXY_REPLICAS') | default(1, true) | int }}"

# 管理者グループ名 (Keycloak / Grafana / Open WebUI 共通)
admin_group_name: "{{ lookup('env', 'ADMIN_GROUP_NAME') | default('rancher-admins', true) }}"

# Rancher 設定
rancher_hostname: "{{ lookup('env', 'RANCHER_HOSTNAME') | default('rancher.' + email_domain, true) }}"
rancher_replicas: "{{ lookup('env', 'RANCHER_REPLICAS') | default(1, true) | int }}"
rancher_admin_password: "{{ lookup('env', 'RANCHER_ADMIN_PASSWORD') | default('admin12345', true) }}"
rancher_client_secret: "{{ lookup('env', 'RANCHER_CLIENT_SECRET') | default('rancher-secret', true) }}"
cert_manager_chart_version: "{{ lookup('env', 'CERT_MANAGER_CHART_VERSION') | default('v1.21.2', true) }}"
cert_manager_replicas: "{{ lookup('env', 'CERT_MANAGER_REPLICAS') | default(1, true) | int }}"
cluster_issuer_name: "{{ lookup('env', 'CLUSTER_ISSUER_NAME') | default('internal-ca-issuer', true) }}"
rancher_chart_version: "{{ lookup('env', 'RANCHER_CHART_VERSION') | default('2.15.2', true) }}"

# Keycloak 設定
keycloak_hostname: "{{ lookup('env', 'KEYCLOAK_HOSTNAME') | default('keycloak.' + email_domain, true) }}"
keycloak_admin_user: "{{ lookup('env', 'KEYCLOAK_ADMIN_USER') | default('admin', true) }}"
keycloak_admin_password: "{{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') | default('admin', true) }}"
keycloak_replicas: "{{ lookup('env', 'KEYCLOAK_REPLICAS') | default(1, true) | int }}"
keycloak_pg_chart_version: "{{ lookup('env', 'KEYCLOAK_PG_CHART_VERSION') | default('16.7.27', true) }}"
keycloak_pg_replica_count: "{{ lookup('env', 'KEYCLOAK_PG_REPLICA_COUNT') | default(1, true) | int }}"
keycloak_pg_max_connections: "{{ lookup('env', 'KEYCLOAK_PG_MAX_CONNECTIONS') | default(200, true) | int }}"
keycloak_pg_storage_class: "{{ lookup('env', 'KEYCLOAK_PG_STORAGE_CLASS') | default('local-path', true) }}"
keycloak_pg_storage_size: "{{ lookup('env', 'KEYCLOAK_PG_STORAGE_SIZE') | default('10Gi', true) }}"
keycloak_pg_primary_pod: "{{ lookup('env', 'KEYCLOAK_PG_PRIMARY_POD') | default('keycloak-pg-postgresql-0', true) }}"
keycloak_pg_host: "{{ lookup('env', 'KEYCLOAK_PG_HOST') | default('keycloak-pg-postgresql', true) }}"
keycloak_chart_version: "{{ lookup('env', 'KEYCLOAK_CHART_VERSION') | default('3.0.12', true) }}"
keycloak_pg_password: "{{ lookup('env', 'KEYCLOAK_PG_PASSWORD') | default('keycloak-pg-2026', true) }}"
keycloak_db_password: "{{ lookup('env', 'KEYCLOAK_DB_PASSWORD') | default('keycloak-db-2026', true) }}"
keycloak_pg_shared_buffers: "{{ lookup('env', 'KEYCLOAK_PG_SHARED_BUFFERS') | default('512MB', true) }}"
keycloak_pg_effective_cache_size: "{{ lookup('env', 'KEYCLOAK_PG_EFFECTIVE_CACHE_SIZE') | default('1536MB', true) }}"
keycloak_pg_work_mem: "{{ lookup('env', 'KEYCLOAK_PG_WORK_MEM') | default('16MB', true) }}"
keycloak_pg_maintenance_work_mem: "{{ lookup('env', 'KEYCLOAK_PG_MAINTENANCE_WORK_MEM') | default('128MB', true) }}"
keycloak_pg_wal_buffers: "{{ lookup('env', 'KEYCLOAK_PG_WAL_BUFFERS') | default('16MB', true) }}"
keycloak_pg_checkpoint_completion_target: "{{ lookup('env', 'KEYCLOAK_PG_CHECKPOINT_COMPLETION_TARGET') | default('0.9', true) }}"
keycloak_pg_checkpoint_timeout: "{{ lookup('env', 'KEYCLOAK_PG_CHECKPOINT_TIMEOUT') | default('15min', true) }}"
keycloak_pg_min_wal_size: "{{ lookup('env', 'KEYCLOAK_PG_MIN_WAL_SIZE') | default('1GB', true) }}"
keycloak_pg_max_wal_size: "{{ lookup('env', 'KEYCLOAK_PG_MAX_WAL_SIZE') | default('4GB', true) }}"
keycloak_pg_random_page_cost: "{{ lookup('env', 'KEYCLOAK_PG_RANDOM_PAGE_COST') | default('1.1', true) }}"
keycloak_pg_effective_io_concurrency: "{{ lookup('env', 'KEYCLOAK_PG_EFFECTIVE_IO_CONCURRENCY') | default(200, true) | int }}"
keycloak_pg_default_statistics_target: "{{ lookup('env', 'KEYCLOAK_PG_DEFAULT_STATISTICS_TARGET') | default(100, true) | int }}"
keycloak_pg_max_worker_processes: "{{ lookup('env', 'KEYCLOAK_PG_MAX_WORKER_PROCESSES') | default(8, true) | int }}"
keycloak_pg_max_parallel_workers: "{{ lookup('env', 'KEYCLOAK_PG_MAX_PARALLEL_WORKERS') | default(4, true) | int }}"
keycloak_pg_max_parallel_workers_per_gather: "{{ lookup('env', 'KEYCLOAK_PG_MAX_PARALLEL_WORKERS_PER_GATHER') | default(2, true) | int }}"
keycloak_pg_max_parallel_maintenance_workers: "{{ lookup('env', 'KEYCLOAK_PG_MAX_PARALLEL_MAINTENANCE_WORKERS') | default(2, true) | int }}"
keycloak_pg_log_min_duration_statement: "{{ lookup('env', 'KEYCLOAK_PG_LOG_MIN_DURATION_STATEMENT') | default(1000, true) | int }}"
keycloak_pg_metrics_enabled: "{{ lookup('env', 'KEYCLOAK_PG_METRICS_ENABLED') | default(true, true) | bool }}"
keycloak_pg_memory_limit: "{{ lookup('env', 'KEYCLOAK_PG_MEMORY_LIMIT') | default('1536Mi', true) }}"
keycloak_pg_memory_request: "{{ lookup('env', 'KEYCLOAK_PG_MEMORY_REQUEST') | default('768Mi', true) }}"
keycloak_pg_cpu_limit: "{{ lookup('env', 'KEYCLOAK_PG_CPU_LIMIT') | default('1000m', true) }}"
keycloak_pg_cpu_request: "{{ lookup('env', 'KEYCLOAK_PG_CPU_REQUEST') | default('250m', true) }}"
keycloak_events_enabled: "{{ lookup('env', 'KEYCLOAK_EVENTS_ENABLED') | default(true, true) | bool }}"
keycloak_events_expiration: "{{ lookup('env', 'KEYCLOAK_EVENTS_EXPIRATION') | default(2592000, true) | int }}"
keycloak_admin_events_enabled: "{{ lookup('env', 'KEYCLOAK_ADMIN_EVENTS_ENABLED') | default(true, true) | bool }}"
keycloak_admin_events_details_enabled: "{{ lookup('env', 'KEYCLOAK_ADMIN_EVENTS_DETAILS') | default(true, true) | bool }}"

# Grafana 設定
grafana_hostname: "{{ lookup('env', 'GRAFANA_HOSTNAME') | default('grafana.' + email_domain, true) }}"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('admin', true) }}"
grafana_client_secret: "{{ lookup('env', 'GRAFANA_CLIENT_SECRET') | default('grafana-secret', true) }}"
grafana_replicas: "{{ lookup('env', 'GRAFANA_REPLICAS') | default(1, true) | int }}"
grafana_db_password: "{{ lookup('env', 'GRAFANA_DB_PASSWORD') | default('grafana-db-2026', true) }}"
grafana_db_max_open_conn: "{{ lookup('env', 'GRAFANA_DB_MAX_OPEN_CONN') | default(20, true) | int }}"
grafana_db_max_idle_conn: "{{ lookup('env', 'GRAFANA_DB_MAX_IDLE_CONN') | default(10, true) | int }}"
kube_prometheus_stack_chart_version: "{{ lookup('env', 'KUBE_PROMETHEUS_STACK_CHART_VERSION') | default('91.4.1', true) }}"
rancher_monitoring_dashboards_chart_version: "{{ lookup('env', 'RANCHER_MONITORING_DASHBOARDS_CHART_VERSION') | default('110.0.0+up0.1.2', true) }}"
alertmanager_replicas: "{{ lookup('env', 'ALERTMANAGER_REPLICAS') | default(1, true) | int }}"
monitoring_proxy_replicas: "{{ lookup('env', 'MONITORING_PROXY_REPLICAS') | default(1, true) | int }}"

# Prometheus 監視基盤設定
prometheus_replicas: "{{ lookup('env', 'PROMETHEUS_REPLICAS') | default(1, true) | int }}"
prometheus_retention: "{{ lookup('env', 'PROMETHEUS_RETENTION') | default('7d', true) }}"
prometheus_scrape_interval: "{{ lookup('env', 'PROMETHEUS_SCRAPE_INTERVAL') | default('30s', true) }}"
prometheus_evaluation_interval: "{{ lookup('env', 'PROMETHEUS_EVALUATION_INTERVAL') | default('60s', true) }}"
prometheus_cpu_limit: "{{ lookup('env', 'PROMETHEUS_CPU_LIMIT') | default('4000m', true) }}"
prometheus_memory_limit: "{{ lookup('env', 'PROMETHEUS_MEMORY_LIMIT') | default('4Gi', true) }}"
prometheus_cpu_request: "{{ lookup('env', 'PROMETHEUS_CPU_REQUEST') | default('500m', true) }}"
prometheus_memory_request: "{{ lookup('env', 'PROMETHEUS_MEMORY_REQUEST') | default('1Gi', true) }}"

# pgAdmin 4 設定
pgadmin_hostname: "{{ lookup('env', 'PGADMIN_HOSTNAME') | default('pgadmin.' + email_domain, true) }}"
pgadmin_admin_email: "{{ lookup('env', 'PGADMIN_ADMIN_EMAIL') | default('admin@' + email_domain, true) }}"
pgadmin_admin_password: "{{ lookup('env', 'PGADMIN_ADMIN_PASSWORD') | default('admin', true) }}"
pgadmin_replicas: "{{ lookup('env', 'PGADMIN_REPLICAS') | default(1, true) | int }}"
pgadmin_image: "{{ lookup('env', 'PGADMIN_IMAGE') | default('docker.io/dpage/pgadmin4:latest', true) }}"
pgadmin_client_secret: "{{ lookup('env', 'PGADMIN_CLIENT_SECRET') | default('pgadmin-secret', true) }}"
pgadmin_log_level: "{{ lookup('env', 'PGADMIN_LOG_LEVEL') | default('DEBUG', true) }}"
pgadmin_static_crypt_key: "{{ lookup('env', 'PGADMIN_STATIC_CRYPT_KEY') | default('k3d-pgadmin-master-key-2026', true) }}"

# AMD GPU Device Plugin 設定 (ROCm k8s-device-plugin)
amd_gpu_plugin_enabled: "{{ lookup('env', 'AMD_GPU_PLUGIN_ENABLED') | default(true, true) | bool }}"
amd_gpu_chart_version: "{{ lookup('env', 'AMD_GPU_CHART_VERSION') | default('0.22.0', true) }}"
amd_gpu_device_plugin_tag: "{{ lookup('env', 'AMD_GPU_DEVICE_PLUGIN_TAG') | default('1.31.0.9', true) }}"
amd_gpu_device_plugin_repository: "docker.io/rocm/k8s-device-plugin"
amd_gpu_daemonset_name: "amd-gpu-device-plugin-daemonset"
amd_gpu_nfd_enabled: false
amd_gpu_labeller_enabled: false
amd_gpu_node_selector_enabled: "{{ lookup('env', 'AMD_GPU_NODE_SELECTOR_ENABLED') | default(true, true) | bool }}"
kfd_device_path: "{{ lookup('env', 'KFD_DEVICE_PATH') | default('/dev/kfd', true) }}"
dri_device_path: "{{ lookup('env', 'DRI_DEVICE_PATH') | default('/dev/dri', true) }}"

# AMD NPU (XDNA) Device Plugin 設定
amd_npu_plugin_enabled: "{{ lookup('env', 'AMD_NPU_PLUGIN_ENABLED') | default(true, true) | bool }}"
accel_device_path: "{{ lookup('env', 'ACCEL_DEVICE_PATH') | default('/dev/accel', true) }}"
amd_npu_device_plugin_image: "{{ lookup('env', 'AMD_NPU_DEVICE_PLUGIN_IMAGE') | default('docker.io/squat/generic-device-plugin:latest', true) }}"
amd_npu_resource_domain: "{{ lookup('env', 'AMD_NPU_RESOURCE_DOMAIN') | default('amd.com', true) }}"
amd_npu_device_name: "{{ lookup('env', 'AMD_NPU_DEVICE_NAME') | default('npu', true) }}"
amd_npu_device_count: "{{ lookup('env', 'AMD_NPU_DEVICE_COUNT') | default(1, true) | int }}"
amd_npu_daemonset_name: "amd-npu-device-plugin"

# Ollama LLM / AI サービス設定 (Worker ノード配置)
ollama_enabled: "{{ lookup('env', 'OLLAMA_ENABLED') | default(true, true) | bool }}"
ollama_chart_version: "{{ lookup('env', 'OLLAMA_CHART_VERSION') | default('1.84.0', true) }}"
ollama_image_tag: "{{ lookup('env', 'OLLAMA_IMAGE_TAG') | default('0.34.4-rocm', true) }}"
ollama_image_repository: "docker.io/ollama/ollama"
ollama_hostname: "{{ lookup('env', 'OLLAMA_HOSTNAME') | default('ollama.' + email_domain, true) }}"
ollama_port: "{{ lookup('env', 'OLLAMA_PORT') | default(11434, true) | int }}"
ollama_replicas: "{{ lookup('env', 'OLLAMA_REPLICAS') | default(1, true) | int }}"
ollama_gpu_enabled: "{{ lookup('env', 'OLLAMA_GPU_ENABLED') | default(true, true) | bool }}"
ollama_gpu_type: "{{ lookup('env', 'OLLAMA_GPU_TYPE') | default('amd', true) }}"
ollama_gpu_number: "{{ lookup('env', 'OLLAMA_GPU_NUMBER') | default(1, true) | int }}"
ollama_persistence_enabled: true
ollama_storage_class: "{{ lookup('env', 'OLLAMA_STORAGE_CLASS') | default('local-path', true) }}"
ollama_storage_size: "{{ lookup('env', 'OLLAMA_STORAGE_SIZE') | default('30Gi', true) }}"
ollama_cpu_request: "{{ lookup('env', 'OLLAMA_CPU_REQUEST') | default('500m', true) }}"
ollama_memory_request: "{{ lookup('env', 'OLLAMA_MEMORY_REQUEST') | default('2Gi', true) }}"
ollama_memory_limit: "{{ lookup('env', 'OLLAMA_MEMORY_LIMIT') | default('16Gi', true) }}"
ollama_exporter_port: "{{ lookup('env', 'OLLAMA_EXPORTER_PORT') | default(9115, true) | int }}"
ollama_probe_path: "{{ lookup('env', 'OLLAMA_PROBE_PATH') | default('/api/tags', true) }}"
